[workspace]
resolver = "2"
members = [
  "dna/zomes/zome_fn_input",
  "dna/zomes/where_integrity",
  "dna/zomes/where",
  "dna/zomes/playset_integrity",
  "dna/zomes/playset",
  "dna/zomes/ludotheque_integrity",
  "dna/zomes/ludotheque",
  "dna/zomes/profiles_integrity",
  "dna/zomes/profiles"
  ]

[workspace.package]
version = "3.0.0"
rust-version = "1.93.0"
edition = "2021"

# Exact pins: a rebuilt zome is a new DNA hash, so the 0.7 DNA line must not float.
[workspace.dependencies]
serde = { version = "=1.0.228", default-features = false }
holochain_serialized_bytes = "=0.0.57"
hdi = { version = "=0.8.1", default-features = false, features = ["trace"] }
hdk = { version = "=0.7.1", default-features = false }

# zdk 0.7 line, rev-pinned (same rev vines pins).
zome_utils = { git = "https://github.com/ddd-mtl/zdk", rev = "90f79989400e2930587b196ef56d488bf9ac808c" }
zome_core = { git = "https://github.com/ddd-mtl/zdk", rev = "90f79989400e2930587b196ef56d488bf9ac808c" }

hc_zome_profiles_integrity = { git = "https://github.com/holochain-open-dev/profiles", tag = "v0.702.0" }
# zdk's alternate profiles coordinator: the one @ddd-qc/profiles-dvm (ProfilesAltZvm) talks to.
hc_zome_profiles_coordinator = { git = "https://github.com/ddd-mtl/zdk", rev = "90f79989400e2930587b196ef56d488bf9ac808c", package = "profiles_alt_coordinator" }

zome_fn_input = { path = "dna/zomes/zome_fn_input" }


[profile.dev]
lto = false
opt-level = 0
overflow-checks = false

[profile.release]
opt-level = "z"
lto = true
